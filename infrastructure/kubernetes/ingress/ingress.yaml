apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservice-impact-ingress
  namespace: microservice-impact
spec:
  rules:
    - host: dependency-impact.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
