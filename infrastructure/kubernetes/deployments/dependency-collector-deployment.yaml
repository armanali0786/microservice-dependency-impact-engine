apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-collector
  namespace: microservice-impact
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dependency-collector
  template:
    metadata:
      labels:
        app: dependency-collector
    spec:
      containers:
        - name: dependency-collector
          image: microservice-impact/dependency-collector:latest
          ports:
            - containerPort: 8082
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: dependency-collector-config
