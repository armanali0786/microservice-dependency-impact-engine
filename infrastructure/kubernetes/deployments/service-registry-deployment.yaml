apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-registry
  namespace: microservice-impact
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-registry
  template:
    metadata:
      labels:
        app: service-registry
    spec:
      containers:
        - name: service-registry
          image: microservice-impact/service-registry:latest
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: service-registry-config
