apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: microservice-impact
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: microservice-impact/notification-service:latest
          ports:
            - containerPort: 8086
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: notification-service-config
