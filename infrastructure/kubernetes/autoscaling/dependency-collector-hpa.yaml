apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dependency-collector-hpa
  namespace: microservice-impact
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dependency-collector
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
