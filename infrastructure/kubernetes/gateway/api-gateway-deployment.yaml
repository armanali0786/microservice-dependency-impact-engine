apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: microservice-impact
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: microservice-impact/api-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: api-gateway-config
