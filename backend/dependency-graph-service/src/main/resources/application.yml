spring:
  application:
    name: dependency-graph-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dependency_impact}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:app_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: dependency-graph-consumers
      auto-offset-reset: earliest
      # Must be false for retry/DLQ to behave correctly - the offset should only
      # advance after the listener returns normally or the error handler's
      # recoverer has published to the DLQ, never on a timer regardless of outcome
      # (docs/kafka-spec.md section 28).
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

graph:
  traversal:
    default-depth: 2
    max-depth: 5
    max-nodes: 500

kafka:
  retry:
    max-retries: 4
    initial-interval-ms: 1000
    multiplier: 2.0

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
