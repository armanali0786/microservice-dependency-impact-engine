name: Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - service-registry
          - dependency-collector
          - dependency-graph-service
          - impact-analysis-service
          - runtime-analysis-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f backend/${{ matrix.service }}/Dockerfile -t microservice-impact/${{ matrix.service }}:${{ github.sha }} .
